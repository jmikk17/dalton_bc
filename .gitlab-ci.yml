variables:
  GIT_SSL_NO_VERIFY: "true"
  GIT_STRATEGY: "fetch"
  GIT_SUBMODULE_STRATEGY: "recursive"
  GET_SOURCES_ATTEMPTS: "10"

default:
  before_script:
    - dnf install -y gcc gcc-c++ gcc-gfortran openblas openblas-devel lapack lapack-devel
                     mpich mpich-devel openmpi openmpi-devel hdf5 hdf5-devel git make cmake
                     python python3 python3-pip python3-h5py redhat-rpm-config findutils
                     which procps-ng coreutils environment-modules
    - . ~/.bashrc
    - . /etc/profile.d/modules.sh
    - module purge
    - module avail
    - uname -a
    - lscpu
    - free -h
    - gfortran --version
    - gcc --version
    - g++ --version
    - module load mpi/openmpi-x86_64
    - mpirun --version
    - module purge
    - module load mpi/mpich-x86_64
    - mpirun --version
    - module purge
    - python3 --version
    - git --version
    - cmake --version

coverage:
  image: fedora:37
  tags:
    - saas-linux-2xlarge-amd64
  coverage: '/Percentage Coverage:\s*([^%]+)/'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_NAMESPACE == 'dalton'
    - if: $CI_PIPELINE_SOURCE == 'schedules'
      when: never
  script:
    - dnf install -y -q gcovr
    - module load mpi/mpich-x86_64
    - mpirun --version
    - pip install -q codecov
    - python setup --mpi --blas=none --lapack=none --explicit-libs="-lopenblas -llapack" --type=release --coverage
                   -DENABLE_PDE=ON
    - cd build
    - make -j 32
    - export DALTON_LAUNCHER="mpirun -n 4"
    - export OMP_NUM_THREADS=1
    - ctest -j 4 --output-on-failure -L dalton -LE "serial|long|verylong"
    - export DALTON_LAUNCHER=""
    - export OMP_NUM_THREADS=1
    - ctest -j 16 --output-on-failure -L serial -LE "long|verylong"
    - ctest -D ExperimentalCoverage
  interruptible: true

intel-oneapi-serial:
  image: fedora:40
  variables:
    DALTON_LAUNCHER: ""
    OMP_NUM_THREADS: "1"
  tags:
    - saas-linux-medium-amd64
  rules:
    - when: always
    - if: $CI_PIPELINE_SOURCE == 'schedules'
      when: never
  allow_failure: true
  before_script:
    # Update system and install necessary packages
    - dnf -y update
    - dnf -y install git python python3 python3-pip wget pkg-config ca-certificates gnupg cmake environment-modules
    # Download Intel GPG key
    - wget https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
    # Import Intel GPG key
    - rpm --import GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
    # Add Intel oneAPI repository
    - echo -e "[oneAPI]\nname=Intel(R) oneAPI repository\nbaseurl=https://yum.repos.intel.com/oneapi\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB" | sudo tee /etc/yum.repos.d/oneAPI.repo
    # Install Intel oneAPI packages
    - dnf -y update
    - dnf -y install intel-oneapi-compiler-dpcpp-cpp intel-oneapi-compiler-fortran intel-oneapi-mkl intel-oneapi-mpi intel-oneapi-mpi-devel
    # Set up environment for Intel oneAPI
    - . /etc/profile.d/modules.sh
    - /opt/intel/oneapi/modulefiles-setup.sh --ignore-latest --output-dir=~/intel-oneapi-modulefiles --force
    - module use ~/intel-oneapi-modulefiles
    - module purge
    - echo "=== Available modules ==="
    - module avail
    - module load tbb/2022.1 compiler-rt/2025.1.0 compiler/2025.1.0 mkl/2025.1 mpi
    # Print useful info
    - uname -a
    - lscpu
    - free -h
    - ifx --version
    - icx --version
    - icpx --version
    - mpirun --version
    - echo "MKLROOT=$MKLROOT"
    - python3 --version
    - git --version
    - cmake --version
  script:
    - ulimit -s unlimited
    - echo "The shell is $SHELL"
    - let "N_PROC=$(cat /proc/cpuinfo | grep processor | wc -l)"
    - echo "Number of processors/jobs for the build step is $N_PROC"
    - python setup --fc=ifx --cc=icx --cxx=icpx --mkl=sequential --type=release
    - cd build
    - make -j $N_PROC
    - ldd dalton.x
    - echo "Running ctest with $N_PROC jobs"
    - ctest -j$N_PROC --output-on-failure -L "serial|essential" -LE "long|verylong" -E cc_rsp_alpha
  artifacts:
    when: always
    paths:
      - build/test/
    expire_in: 3 days
  interruptible: true

