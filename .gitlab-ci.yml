variables:
  GIT_SSL_NO_VERIFY: "true"
  GIT_STRATEGY: "fetch"
  GIT_SUBMODULE_STRATEGY: "recursive"
  GET_SOURCES_ATTEMPTS: "10"

default:
  before_script:
    - dnf install -y gcc gcc-c++ gcc-gfortran openblas openblas-devel lapack lapack-devel
                     mpich mpich-devel openmpi openmpi-devel hdf5 hdf5-devel git make cmake
                     python python3 python3-pip python3-h5py redhat-rpm-config findutils
                     which procps-ng coreutils environment-modules
    - . ~/.bashrc
    - . /etc/profile.d/modules.sh
    - module purge
    - module avail
    - uname -a
    - lscpu
    - free -h
    - gfortran --version
    - gcc --version
    - g++ --version
    - module load mpi/openmpi-x86_64
    - mpirun --version
    - module purge
    - module load mpi/mpich-x86_64
    - mpirun --version
    - module purge
    - python3 --version
    - git --version
    - cmake --version

coverage:
  image: fedora:37
  tags:
    - saas-linux-2xlarge-amd64
  coverage: '/Percentage Coverage:\s*([^%]+)/'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_NAMESPACE == 'dalton'
    - if: $CI_PIPELINE_SOURCE == 'schedules'
      when: never
  script:
    - dnf install -y -q gcovr
    - module load mpi/mpich-x86_64
    - mpirun --version
    - pip install -q codecov
    - python setup --mpi --blas=none --lapack=none --explicit-libs="-lopenblas -llapack" --type=release --coverage
                   -DENABLE_PDE=ON
    - cd build
    - make -j 32
    - export DALTON_LAUNCHER="mpirun -n 4"
    - export OMP_NUM_THREADS=1
    - ctest -j 4 --output-on-failure -L dalton -LE "serial|long|verylong"
    - export DALTON_LAUNCHER=""
    - export OMP_NUM_THREADS=1
    - ctest -j 16 --output-on-failure -L serial -LE "long|verylong"
    - ctest -D ExperimentalCoverage
  interruptible: true

intel-oneapi-2024.2.1:
  image: fedora:37
  variables:
    DALTON_LAUNCHER: ""
    OMP_NUM_THREADS: "1"
  tags:
    - saas-linux-2xlarge-amd64
  rules:
    - when: always
    - if: $CI_PIPELINE_SOURCE == 'schedules'
      when: never
  allow_failure: true
  before_script:
    - mv maintenance/oneAPI.repo /etc/yum.repos.d/oneAPI.repo
    - dnf install -y gcc gcc-c++ gcc-gfortran git make cmake
                     python python3 python3-pip redhat-rpm-config findutils
                     which procps-ng coreutils environment-modules
                     intel-oneapi-compiler-dpcpp-cpp-2024.2.1-1079
                     intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic-2023.2.1-16
                     intel-oneapi-compiler-fortran-2024.2.1-1079
                     intel-oneapi-mkl-2024.2.1-103 intel-oneapi-mkl-devel-2024.2.1-103
    - . /etc/profile.d/modules.sh
    - /opt/intel/oneapi/modulefiles-setup.sh --ignore-latest --output-dir=~/intel-oneapi-modulefiles --force
    - module use ~/intel-oneapi-modulefiles
    - module purge
    - module load tbb/2021.13 compiler-rt/2024.2.1 compiler/2024.2.1 mkl/2024.2 oclfpga/2023.2.1
    - uname -a
    - lscpu
    - free -h
    - ifx --version
    - icx --version
    - icpx --version
    - python3 --version
    - git --version
    - cmake --version
  script:
    - python setup --fc=ifx --cc=icx --cxx=icpx --mkl=sequential --type=release
    - cd build
    - make -j 32
    - ctest -j 16 --output-on-failure -L serial -LE "long|verylong"
  interruptible: true

