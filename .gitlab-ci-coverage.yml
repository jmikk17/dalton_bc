coverage:
  image: fedora:37
  coverage: '/Percentage Coverage:\s*([^%]+)/'
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event' && $CI_PIPELINE_SOURCE != 'schedules'
      when: manual
  before_script:
    - dnf install -y gcc gcc-c++ gcc-gfortran openblas openblas-devel lapack lapack-devel
                     mpich mpich-devel openmpi openmpi-devel hdf5 hdf5-devel git make cmake
                     python python3 python3-pip python3-h5py redhat-rpm-config findutils
                     which procps-ng coreutils environment-modules
    - . ~/.bashrc
    - . /etc/profile.d/modules.sh
    - module purge
    - module avail
    - uname -a
    - lscpu
    - free -h
    - gfortran --version
    - gcc --version
    - g++ --version
    - python3 --version
    - git --version
    - cmake --version
  script:
    - dnf install -y -q gcovr
    - gcovr --version
    - module load mpi/mpich-x86_64
    - mpirun --version
    - pip install -q codecov
    - cores=$(LC_ALL=C lscpu | awk '/^Core\(s\) per socket:/ {print $4}')
    - sockets=$(LC_ALL=C lscpu | awk '/^Socket\(s\):/ {print $2}')
    - N_PROC=$((cores * sockets))
    - echo "Number of processors/jobs for the build step is $N_PROC"
    - python setup --mpi --blas=none --lapack=none --explicit-libs="-lopenblas -llapack" --type=release --coverage
                   -DENABLE_PDE=ON
    - cd build
    - make -j $N_PROC
    - export OMP_NUM_THREADS=1
    - |
      if [ "$N_PROC" -lt 4 ]; then
        M=$((N_PROC / 2))
        export DALTON_LAUNCHER="mpirun -n 2"
      else
        M=$((N_PROC / 4))
        export DALTON_LAUNCHER="mpirun -n 4"
      fi
      echo "DALTON_LAUNCHER=\"$DALTON_LAUNCHER\"" > var.env
      echo "M=$M" >> var.env
    - source var.env
    - export DALTON_LAUNCHER=$DALTON_LAUNCHER
    - echo "DALTON_LAUNCHER is set to $DALTON_LAUNCHER"
    - export MPICH_NO_LOCAL=1
    - echo "Running ctest in parallel with $M jobs"
    - ctest -j$M --output-on-failure -L dalton -LE "serial|long|verylong"
    - df -m
    - ctest -j$M --output-on-failure -L dalton -LE "serial|short|medium"
    - df -m
    - export DALTON_LAUNCHER=""
    - echo "Running ctest serially with $N_PROC jobs"
    - ctest -j$N_PROC --output-on-failure -L serial -LE "long|verylong" -E "fde_static-vemb_dipole_short"
    - df -m
    - ctest -j$N_PROC --output-on-failure -L serial -LE "short|medium" -E "fde_static-vemb_dipole_short"
    - df -m
    - echo "Generating coverage report"
    - ctest -D ExperimentalCoverage
    - cd ..
    - gcovr -r . build/ --exclude 'external/' --txt --print-summary -o coverage.txt
    - cat coverage.txt
    - echo "The command df -m is executed to verify use of shared memory at /dev/shm "
  artifacts:
    when: always
    paths:
      - build/test/
      - coverage.txt
    expire_in: 3 days
  interruptible: true