gcc-9-ompi-4.0:
  image: fedora:31
  variables:
    DALTON_LAUNCHER: "mpirun -n 4 --allow-run-as-root --oversubscribe --bind-to none"
    OMP_NUM_THREADS: "1"
  tags:
    - saas-linux-2xlarge-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_NAMESPACE == 'dalton'
    - if: $CI_PIPELINE_SOURCE == 'schedules'
      when: never
  script:
    - module load mpi/openmpi-x86_64
    - mpirun --version
