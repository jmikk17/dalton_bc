intel-oneapi-serial-32:
  image: fedora:40
  variables:
    DALTON_LAUNCHER: ""
    OMP_NUM_THREADS: "1"
  rules: !reference [.define-build-rules, rules]
  allow_failure: true
  before_script:
    - !reference [.intel-install, before_script]
    # Print useful info
    - uname -a
    - lscpu
    - free -h
    - ifx --version
    - icx --version
    - icpx --version
    - mpirun --version
    - echo "MKLROOT=$MKLROOT"
    - python3 --version
    - git --version
    - cmake --version
  script:
    - !reference [.define-cores, script]
    - ulimit -s unlimited
    - echo "The shell is $SHELL"
    - python setup --fc=ifx --cc=icx --cxx=icpx --mkl=sequential --type=release
    - cd build
    - make -j $N_PROC
    - ldd dalton.x
    - echo "Running ctest with $N_PROC jobs"
    - ctest -j$N_PROC --output-on-failure -L "serial|essential" -LE "long|verylong" -E cc_rsp_alpha
  artifacts:
    when: always
    paths:
      - build/test/
    expire_in: 3 days
  interruptible: true

